<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Stránka nenalezena (404) | Dokonalá Oprava</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #ffffff, #f9fbfd); color: #1f2937;
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { max-width: 560px; width: 100%; background: #fff; border-radius: 20px; padding: 40px 32px;
        box-shadow: 0 10px 40px rgba(0,0,0,.08); text-align: center; }
      .code { font-size: 64px; font-weight: 800; color: #2563eb; margin: 0 0 8px; }
      h1 { font-size: 26px; margin: 0 0 12px; }
      p { color: #4b5563; line-height: 1.6; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
      a.btn { text-decoration: none; padding: 12px 22px; border-radius: 12px; font-weight: 600; }
      a.primary { background: #2563eb; color: #fff; }
      a.ghost { background: #e5e7eb; color: #1f2937; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">404</p>
      <h1>Tuto stránku se nepodařilo najít</h1>
      <p>Stránka byla přesunuta nebo neexistuje. Vraťte se na hlavní stránku, nebo nám rovnou zavolejte.</p>
      <div class="row">
        <a class="btn primary" href="/">Hlavní stránka</a>
        <a class="btn ghost" href="tel:+420730520302">Zavolat +420 730 520 302</a>
      </div>
    </div>
  </body>
</html>
